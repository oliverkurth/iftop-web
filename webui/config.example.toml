# iftop web interface configuration.
# Default location: /etc/iftop-web/config.toml (override with $IFTOP_WEB_CONFIG
# or the collector's --config option).

# At most one interface for now. Empty: iftop picks the first running one.
interfaces = ["eth0"]

iftop = "/usr/sbin/iftop-json"
# Extra iftop arguments, e.g. a pcap filter: ["-f", "not port 22"].
# -i and -P are always passed by the collector.
iftop_args = []

# Written by the collector, read by the web app.
datadir = "/var/lib/iftop-collector"

# Stage 2: how the client side of a connection is found, so its port can be
# stored as "*" (see PLAN.md). Ports of servers that listen on high ports:
server_ports = []          # e.g. [51820, 32400]
# Used only when neither side is a configured server port, a known service or
# below 1024: the higher port is folded if it is at least this.
ephemeral_port_min = 32768

[retention]
minute_days = 7
hour_days = 365

[web]
bind = "0.0.0.0:8443"
certfile = "/etc/iftop-web/cert.pem"
keyfile = "/etc/iftop-web/key.pem"
# Allow plain HTTP on a non-local address, e.g. behind a TLS proxy.
insecure_http = false
# Set when running behind a reverse proxy, so client IPs (used for the login
# rate limit) and the scheme are taken from X-Forwarded-* headers.
proxy_fix = false
# Session cookies are only sent over HTTPS. Set to false only for plain-HTTP
# testing on localhost.
cookie_secure = true
session_timeout_minutes = 60
# Created with a random key on first start if it does not exist.
secret_key_file = "/var/lib/iftop-web/secret_key"
# Owned by the web app's user; separate from datadir.
users_db = "/var/lib/iftop-web/users.db"
login_rate_limit = "5 per minute"
# Chart.js for the history page, from the Debian package libjs-chart.js.
chart_js = "/usr/share/javascript/chart.js/chart.min.js"
